<style>
/* Layout: cuaderno de laboratorio — columna de trabajo + "hoja del evaluador" fija a la derecha; papel milimétrico como motivo de gráficas */
:root {
  --paper: #F2F4F1;
  --card: #FFFFFF;
  --ink: #17201C;
  --muted: #5A6661;
  --line: #D3DBD6;
  --soft: #E7ECE8;
  --accent: #0B6B66;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECE9;
  --grid: #E0684F;
  --grid-soft: rgba(224,104,79,.22);
  --ok: #2B7F3A;
  --ok-soft: #DDF0DF;
  --warn: #9A6412;
  --warn-soft: #F7EAD2;
  --bad: #B23A2C;
  --bad-soft: #F7DEDA;
  --photo: #1C1915;
  --sepia: #EADCC2;
  --hand: #1E3A8A;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-hand: "Caveat", "Comic Sans MS", cursive;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --card: #19201D; --ink: #E3EAE6; --muted: #9AA9A2; --line: #2C3632; --soft: #222B27;
    --accent: #43C2B7; --accent-ink: #062321; --accent-soft: #173A37;
    --grid: #D9785F; --grid-soft: rgba(217,120,95,.20);
    --ok: #63C474; --ok-soft: #1B3320; --warn: #E1A84F; --warn-soft: #3A2C14; --bad: #EF7464; --bad-soft: #3D1E1A;
    --hand: #9DB8FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --card: #19201D; --ink: #E3EAE6; --muted: #9AA9A2; --line: #2C3632; --soft: #222B27;
  --accent: #43C2B7; --accent-ink: #062321; --accent-soft: #173A37;
  --grid: #D9785F; --grid-soft: rgba(217,120,95,.20);
  --ok: #63C474; --ok-soft: #1B3320; --warn: #E1A84F; --warn-soft: #3A2C14; --bad: #EF7464; --bad-soft: #3D1E1A;
  --hand: #9DB8FF; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.12; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--card); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand b { font-family: var(--f-display); font-stretch: 115%; font-weight: 850; font-size: 18px; letter-spacing: -.01em; }
.brand span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { text-decoration: none; color: var(--muted); padding: 7px 11px; border-radius: 8px; font-size: 14.5px; white-space: nowrap; font-weight: 700; }
.tabs a:hover { background: var(--soft); color: var(--ink); }
.tabs a.on { background: var(--ink); color: var(--paper); }
@media (max-width: 720px) { .top .wrap { flex-direction: column; align-items: stretch; gap: 6px; } .brand span { display: none; } }

main { padding-block: 28px 80px; }
.view { display: grid; gap: 28px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 18px; color: var(--muted); max-width: 64ch; }
.sec-h { display: grid; gap: 8px; }
.sec-h h2 { font-size: clamp(26px, 4vw, 36px); font-stretch: 108%; font-weight: 820; letter-spacing: -.015em; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.hero h1 { font-size: clamp(34px, 6vw, 62px); font-stretch: 112%; font-weight: 880; letter-spacing: -.025em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { margin-top: 14px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.countdown { display: flex; gap: 14px; align-items: center; margin-top: 22px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--card); }
.countdown .big { font-family: var(--f-display); font-weight: 900; font-size: 40px; font-stretch: 80%; color: var(--accent); line-height: 1; }
.countdown small { color: var(--muted); display: block; font-size: 13.5px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; text-decoration: none; font-size: 15px; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.btn.acc { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.ghost { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; }
.ghost:hover { border-color: var(--ink); }
.ghost.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--paper); }

/* cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.route { display: grid; gap: 8px; text-decoration: none; color: var(--ink); align-content: start; }
.route:hover { border-color: var(--ink); }
.route h3 { font-size: 20px; font-stretch: 105%; }
.route p { color: var(--muted); font-size: 15px; }
.route .k { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); font-weight: 700; }
.chip.src { background: var(--accent-soft); color: var(--accent); }
.bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* problem cards */
.pcard { display: grid; gap: 10px; text-decoration: none; color: var(--ink); }
.pcard:hover { border-color: var(--ink); }
.pcard h3 { font-size: 21px; font-stretch: 104%; }
.pcard p { color: var(--muted); font-size: 15px; }
.pcard .meta { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

/* problem page */
.pgrid { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 28px; align-items: start; }
@media (max-width: 960px) { .pgrid { grid-template-columns: minmax(0, 1fr); } .pgrid aside { order: -1; } }
.phead { display: grid; gap: 10px; }
.phead h2 { font-size: clamp(28px, 4.4vw, 42px); font-stretch: 110%; font-weight: 860; letter-spacing: -.02em; }
.phead .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.statement { font-size: 16.5px; max-width: 72ch; display: grid; gap: 10px; }
.statement .data { font-family: var(--f-mono); font-size: 14px; background: var(--soft); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.part { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); overflow: hidden; }
.part-h { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; padding: 14px 18px; background: var(--soft); border-bottom: 1px solid var(--line); }
.part-h h3 { font-size: 17px; font-weight: 800; font-family: var(--f-body); line-height: 1.35; }
.part-h .pp { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; color: var(--muted); }
.part-b { padding: 16px 18px; display: grid; gap: 14px; }
.steps { display: grid; gap: 10px; counter-reset: st; }
.step { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; display: grid; gap: 10px; background: var(--card); }
.step.locked { opacity: .55; background: transparent; border-style: dashed; }
.step.done { border-color: var(--ok); background: var(--ok-soft); }
.step.rev { border-color: var(--warn); background: var(--warn-soft); }
.st-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.st-n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.st-l { font-weight: 700; flex: 1; min-width: 160px; }
.st-p { font-family: var(--f-mono); font-size: 13px; font-weight: 600; white-space: nowrap; }
.st-prompt { font-size: 15.5px; }
.ans { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ans input { font-family: var(--f-mono); font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; width: 170px; background: var(--paper); color: var(--ink); }
.ans .unit { font-family: var(--f-mono); color: var(--muted); }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--paper); }
.opt:hover { border-color: var(--ink); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt input { accent-color: var(--accent); }
.opt svg.mini { display: block; }
.st-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fb { font-size: 14.5px; padding: 8px 10px; border-radius: 8px; }
.fb.no { background: var(--bad-soft); color: var(--bad); }
.fb.hint { background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn); }
.fb.ok { background: transparent; color: var(--ok); padding: 0; font-weight: 700; }
.sol { border-left: 3px solid var(--ink); padding: 6px 12px; font-size: 15px; display: grid; gap: 6px; overflow-x: auto; }
.sol .tag { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
.note.warn { background: var(--warn-soft); }
mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }

/* score sheet */
.sheet { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); background: var(--card); border: 1px solid var(--ink); border-radius: var(--r); }
.sheet summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.sheet summary::-webkit-details-marker { display: none; }
.sheet .ttl { font-family: var(--f-display); font-weight: 800; font-size: 16px; font-stretch: 105%; }
.sheet .tot { font-family: var(--f-mono); font-weight: 600; font-size: 22px; }
.sheet .tot small { font-size: 13px; color: var(--muted); }
.sheet-b { padding: 10px 16px 16px; display: grid; gap: 12px; max-height: 70vh; overflow-y: auto; }
.sh-part h4 { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 4px; }
.sh-line { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; font-size: 13.5px; padding: 3px 0; border-bottom: 1px dotted var(--line); align-items: baseline; }
.sh-line .m { font-family: var(--f-mono); font-size: 12px; }
.sh-line .v { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
.sh-line.done .m { color: var(--ok); }
.sh-line.rev .m { color: var(--warn); }
.sheet .rules { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 960px) { .sheet { position: static; } }

/* figures */
.fig { display: grid; gap: 10px; }
.fig-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.photo { background: var(--photo); border-radius: 8px; overflow: hidden; touch-action: none; }
.photo canvas { display: block; width: 100%; cursor: crosshair; }
.readout { font-family: var(--f-mono); font-size: 13.5px; background: var(--soft); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
.mlog { margin: 0; padding-left: 20px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.canvas-box { border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; touch-action: none; }
.canvas-box canvas { display: block; width: 100%; }
.ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 18px; }
.ctrl { display: grid; gap: 2px; font-size: 14px; }
.ctrl .lab { display: flex; justify-content: space-between; gap: 8px; }
.ctrl .lab b { font-family: var(--f-mono); font-weight: 600; }
.ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.chk input { accent-color: var(--accent); }
.spoil { font-family: var(--f-mono); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* table */
.tbl-wrap { overflow-x: auto; }
table.dt { border-collapse: collapse; font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 420px; }
table.dt th, table.dt td { border: 1px solid var(--line); padding: 4px 8px; text-align: right; }
table.dt th { background: var(--soft); font-weight: 600; }
table.dt input { width: 70px; font-family: var(--f-mono); font-size: 14px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); text-align: right; }
table.dt tr.good input { border-color: var(--ok); background: var(--ok-soft); }
table.dt tr.badr input { border-color: var(--bad); background: var(--bad-soft); }
.axsel { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 14px; align-items: center; }
.axsel select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }

/* grader activity */
.handsheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; font-family: var(--f-hand); font-size: 23px; line-height: 1.35; color: var(--hand);
  background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 31px; background-position: 0 12px; overflow-x: auto; }
.handsheet .who { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rub { display: grid; gap: 6px; }
.rub-line { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 14.5px; }
.rub-line .pt { font-family: var(--f-mono); font-size: 13px; }
.rub-line.match { border-color: var(--ok); }
.rub-line.miss { border-color: var(--bad); }
.verdict { font-size: 14px; color: var(--muted); grid-column: 2 / -1; }
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.principle { display: grid; gap: 8px; align-content: start; border-top: 2px solid var(--ink); padding-top: 10px; }
.principle h3 { font-size: 18px; }
.principle .ex { font-family: var(--f-mono); font-size: 13px; background: var(--soft); padding: 8px 10px; border-radius: 8px; }

/* guidance */
.howto { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; font-size: 15px; }
.howto summary { cursor: pointer; }
.howto ol, .steps-list { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 5px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; font-size: inherit; }
.stage-card { display: grid; gap: 12px; scroll-margin-top: 90px; }
.stage-card > h3 { font-size: clamp(21px, 3vw, 26px); font-stretch: 106%; }
.stage { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.qbox { border-left: 3px solid var(--accent); padding: 10px 14px; background: var(--paper); border-radius: 0 8px 8px 0; }
.principle h4 { font-size: 17px; }
.principle .you { font-size: 14px; }
.checklist { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.statement.card { gap: 10px; }
/* rally feedback */
.fblist { display: grid; gap: 10px; }
.fbcard { display: grid; gap: 10px; }
.fbcard summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.fbcard[open] summary { margin-bottom: 10px; }
.fbcard > * + * { margin-top: 10px; }
.fbcard.okc { border-left: 4px solid var(--ok); }
.fbcard.badc { border-left: 4px solid var(--bad); }
.fbgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.okchip { background: var(--ok-soft); color: var(--ok); }
.warnchip { background: var(--warn-soft); color: var(--warn); }
.badchip { background: var(--bad-soft); color: var(--bad); }
/* lab */
.poe { display: grid; gap: 12px; }
.poe-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.poe-h h3 { font-size: 22px; font-stretch: 106%; }
.poe .stage { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* rally */
.rally-top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.timer { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.role { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--card); }
.role b { display: block; }
.role span { font-size: 13.5px; color: var(--muted); }
.chal { display: grid; gap: 12px; }
.chal .q { font-size: 18px; }
.field { display: grid; gap: 4px; font-size: 14px; }
.field input, .field textarea, .field select { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; }
.field textarea { min-height: 90px; resize: vertical; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }

/* =====================================================================
   PROBLEMA 1 — CRONOFOTOGRAFÍA DEL GOLFISTA (ONF 2024, P1, adaptado)

const GOLF = { L: [1.2, 1.3, 1.4, 1.5, 1.6, 1.8, 2.1, 2.5, 3.0, 2.8], Rc: 8.2, Cx: 9, Cy: 9, W: 18, H: 19, dt: 0.016, mp: 0.046, mc: 0.35 };
(() => {
  const phi = []; phi[9] = Math.PI / 2;
  for (let n = 9; n >= 1; n--) phi[n - 1] = phi[n] + 2 * Math.asin(GOLF.L[n - 1] / (2 * GOLF.Rc));
  phi[10] = phi[9] - 2 * Math.asin(GOLF.L[9] / (2 * GOLF.Rc));
  GOLF.phi = phi;
  GOLF.pos = phi.map(a => ({ x: GOLF.Cx + GOLF.Rc * Math.cos(a), y: GOLF.Cy + GOLF.Rc * Math.sin(a) }));

  GOLF.headTop = GOLF.ground - 9.4;
  GOLF.ballRest = { x: GOLF.pos[9].x + 0.15, y: GOLF.Cy + GOLF.Rc };
  GOLF.A = { x: GOLF.ballRest.x + 1.6, y: GOLF.ballRest.y - 0.45 };
  GOLF.B = { x: GOLF.A.x + 4.5, y: GOLF.A.y - 1.3 };

})();
const GW = { line: [{ t: 30, v: 12 }, { t: 170, v: 28 }], ln: Array(10).fill(''), tableOk: false };
const gv = (ctx, k) => ctx[k] != null ? ctx[k] : GOLF_DEF[k];
const GOLF_DEF = { h: 9.4, e: 1.8 / 9.4, labcm: 4.7, labm: 0.9, vp: 56.25, dx: 4.5, dy: 1.3, th: deg(Math.atan(1.3 / 4.5)), at: 344, vC: 41, r: 1.57 };

function golfFigure(host) {
  host.innerHTML = `

    <label class="chk"><input type="checkbox" id="golf-num" checked> Numerar posiciones</label>
    <button class="ghost" id="golf-clear">Borrar trazos</button>
  </div>
  <div class="photo"><canvas id="golf-cv" aria-label="Cronofotografía simulada de un golpe de golf"></canvas></div>
  <div class="readout" id="golf-read">Toca dos puntos para medir. Los puntos se ajustan a marcas cercanas: pelotas, cabezas del palo, extremos de la flecha de altura.</div>
  <ol class="mlog" id="golf-log" reversed></ol>
  <p class="small">Cronofoto recreada para practicar (no es la fotografía original del examen). Las distancias se leen en <b>cm de la foto</b>, como si la midieras con regla sobre la hoja impresa; precisión de 1 mm.</p>`;
  const cv = $('#golf-cv', host);
  let tool = 'medir', pend = [], meas = [], ext = [], selHeads = [], scale = 30, showNum = true;
  const heads = GOLF.pos.map((p, i) => ({ ...p, i }));

  function makeGrain(w, h) { const o = document.createElement('canvas'); o.width = w; o.height = h; const c = o.getContext('2d'); const id = c.createImageData(w, h); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; } c.putImageData(id, 0, 0); return o; }

    c.fillStyle = 'rgba(120,105,80,.35)'; c.fillRect(0, GOLF.ground * s, w, h - GOLF.ground * s);
    // faint club positions
    const club = (a, alpha, lw) => {
      const hx = GOLF.Cx + 3.4 * Math.cos(a), hy = GOLF.Cy + 3.4 * Math.sin(a), x = GOLF.Cx + GOLF.Rc * Math.cos(a), y = GOLF.Cy + GOLF.Rc * Math.sin(a);

      c.beginPath(); c.moveTo(...P(hx, hy)); c.lineTo(...P(x, y)); c.stroke();
      c.save(); c.translate(...P(x, y)); c.rotate(a + Math.PI / 2); c.fillStyle = `rgba(234,220,194,${Math.min(1, alpha + .15)})`;
      c.beginPath(); c.ellipse(0, 0, .42 * s, .17 * s, 0, 0, Math.PI * 2); c.fill(); c.restore();
    };
    GOLF.faint.forEach(a => club(a, .38, Math.max(1, .07 * s)));

    [[GOLF.headTop, 1], [GOLF.ground, -1]].forEach(([y, d]) => { c.beginPath(); c.moveTo(...P(ax, y)); c.lineTo(...P(ax - .18, y + .4 * d)); c.lineTo(...P(ax + .18, y + .4 * d)); c.closePath(); c.fill(); });
    // balls
    const ball = (p, a) => { c.fillStyle = `rgba(255,250,235,${a})`; c.beginPath(); c.arc(...P(p.x, p.y), Math.max(2.5, .2 * s), 0, Math.PI * 2); c.fill(); };
    ball(GOLF.ballRest, .45); ball(GOLF.A, .95); ball(GOLF.B, .95);
    c.font = `600 ${Math.max(11, .5 * s)}px "JetBrains Mono", monospace`; c.fillStyle = '#9ff0e6';
    c.fillText('A', ...P(GOLF.A.x - .25, GOLF.A.y - .45)); c.fillText('B', ...P(GOLF.B.x - .2, GOLF.B.y - .45));

      GOLF.phi.forEach((a, i) => { const r = GOLF.Rc + .85; c.fillText(String(i), ...P(GOLF.Cx + r * Math.cos(a), GOLF.Cy + r * Math.sin(a) + .18)); }); c.textAlign = 'left'; }

    // overlays
    c.setLineDash([6, 5]); c.strokeStyle = '#7fd3ff'; c.lineWidth = 1.4;
    ext.forEach(e => { e.lines.forEach(([p, q]) => { c.beginPath(); c.moveTo(...P(p.x, p.y)); c.lineTo(...P(q.x, q.y)); c.stroke(); }); c.fillStyle = '#7fd3ff'; c.beginPath(); c.arc(...P(e.X.x, e.X.y), 4, 0, Math.PI * 2); c.fill(); });
    c.setLineDash([]); c.strokeStyle = '#ffd54a'; c.fillStyle = '#ffd54a'; c.lineWidth = 2;
    meas.forEach((m, k) => { c.globalAlpha = k === meas.length - 1 ? 1 : .55; c.beginPath(); c.moveTo(...P(m.a.x, m.a.y)); c.lineTo(...P(m.b.x, m.b.y)); c.stroke(); [m.a, m.b].forEach(p => { c.beginPath(); c.arc(...P(p.x, p.y), 3.5, 0, Math.PI * 2); c.fill(); }); });

      const [x, y] = path[Math.min(k, path.length - 1)]; c.fillStyle = tok('--grid'); c.beginPath(); c.arc(X(x), Y(y), 7, 0, Math.PI * 2); c.fill(); }
  };
  const redraw = setupCanvas($('#cs-cv', host), w => Math.max(260, Math.min(380, w * .62)), draw);
  $('#cs-go', host).addEventListener('click', () => {
    cancelAnimationFrame(anim); const r = simulate(); path = r.pts; out = r.res; k = 0; $('#cs-r', host).textContent = 'El carrito va en camino…';

    anim = requestAnimationFrame(step);
  });
}

function iceFigure(host) {
  host.innerHTML = `<div class="two"><div class="canvas-box"><canvas id="ic-cv" aria-label="Recipiente con hielo flotando"></canvas></div>
  <div class="fig">${slider('ic-f', 'Fracción de hielo derretida', 0, 1, 0.05, 0, '')}
  <div class="seg" role="group" aria-label="Líquido"><button data-l="sal" class="on">Agua salada (ρ₁ = 1.15)</button><button data-l="dulce">Agua dulce (ρ₁ = 1.00)</button></div>
  <label class="chk"><input type="checkbox" id="ic-sp"> Mostrar cambio de nivel (spoiler)</label>
  <div class="readout" id="ic-r" style="white-space:pre-wrap"></div>
  <p class="small">Línea punteada: nivel inicial. Prueba primero con agua dulce: ¿cambia el nivel al derretirse el hielo?</p></div></div>`;
  let liq = 'sal';
  const S0 = 100, V0 = 1000, m = 1000;
  const calc = f => { const r1 = liq === 'sal' ? 1.15 : 1; const V1 = m / r1, h0 = (V0 + V1) / S0; const r2 = (r1 * V0 + f * m) / (V0 + f * m); const vol = V0 + f * m + (1 - f) * m / r2; return { h0, h: vol / S0, r2 }; };
  const fS = bindSlider('ic-f', '', () => redraw(), 2);
  const draw = (c, w, h) => {
    c.fillStyle = tok('--card'); c.fillRect(0, 0, w, h);
    const f = fS(), r = calc(f); const sc = (h - 40) / 26; const gx = w * .25, gw = w * .5, gb = h - 16;
    c.fillStyle = liq === 'sal' ? tok('--accent-soft') : tok('--soft'); c.fillRect(gx, gb - r.h * sc, gw, r.h * sc);
    const iceV = (1 - f) * m / 0.917, sub = (1 - f) * m / r.r2; const side = Math.cbrt(iceV) * sc * .45; const subH = side * sub / iceV;
    if (f < 1) { c.fillStyle = 'rgba(200,230,255,.9)'; c.strokeStyle = tok('--hand'); c.lineWidth = 1.5; c.fillRect(gx + gw / 2 - side / 2, gb - r.h * sc - (side - subH), side, side); c.strokeRect(gx + gw / 2 - side / 2, gb - r.h * sc - (side - subH), side, side); }
    c.strokeStyle = tok('--ink'); c.lineWidth = 2.5; c.beginPath(); c.moveTo(gx, 10); c.lineTo(gx, gb); c.lineTo(gx + gw, gb); c.lineTo(gx + gw, 10); c.stroke();
    c.setLineDash([5, 4]); c.strokeStyle = tok('--bad'); c.lineWidth = 1.2; c.beginPath(); c.moveTo(gx - 20, gb - r.h0 * sc); c.lineTo(gx + gw + 20, gb - r.h0 * sc); c.stroke(); c.setLineDash([]);
    let s = `Hielo derretido: ${(f * 100).toFixed(0)} %   ·   densidad del líquido: ${r.r2.toFixed(3)} g/cm³`;
    if ($('#ic-sp', host).checked) s += `\nNivel inicial ${r.h0.toFixed(2)} cm → ahora ${r.h.toFixed(2)} cm (Δh = ${((r.h - r.h0) * 10).toFixed(1)} mm)`;
    $('#ic-r', host).textContent = s;
  };
  const redraw = setupCanvas($('#ic-cv', host), () => 300, draw);
  $$('.seg button', host).forEach(b => b.addEventListener('click', () => { liq = b.dataset.l; $$('.seg button', host).forEach(x => x.classList.toggle('on', x === b)); redraw(); }));
  $('#ic-sp', host).addEventListener('change', redraw);
}

/* mini graphs for choice options */
function miniI(kind) {
  const w = 220, h = 54, y0 = 40, yH = 12, yL = 50; let d = `M4 ${y0}`;
  const seg = (u1, u2, y) => { d += ` L${4 + u1 * 105} ${y} L${4 + u2 * 105} ${y}`; };
  const bounds = [0, .25, .75, 1.25, 1.75, 2];
  if (kind === 'sq') { [[0, .25, yL], [.25, .75, yH], [.75, 1.25, yL], [1.25, 1.75, yH], [1.75, 2, yL]].forEach(s => seg(...s)); }
  if (kind === 'ok') { [[0, .25, y0], [.25, .75, yH], [.75, 1.25, y0], [1.25, 1.75, yH], [1.75, 2, y0]].forEach(s => seg(...s)); }
  if (kind === 'inv') { [[0, .25, yH], [.25, .75, y0], [.75, 1.25, yH], [1.25, 1.75, y0], [1.75, 2, yH]].forEach(s => seg(...s)); }
  if (kind === 'tri') { d = `M4 ${y0}`; [[.25, yH], [.75, y0 + 10], [1.25, yH], [1.75, y0 + 10], [2, (yH + y0 + 10) / 2]].forEach(([u, y]) => d += ` L${4 + u * 105} ${y}`); }
  return `<svg class="mini" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="4" y1="${y0}" x2="${w - 2}" y2="${y0}" stroke="var(--muted)" stroke-width="1"/><line x1="4" y1="4" x2="4" y2="${h - 2}" stroke="var(--muted)" stroke-width="1"/><path d="${d}" fill="none" stroke="var(--hand)" stroke-width="2.2"/><text x="8" y="12" font-size="10" fill="var(--muted)" font-family="monospace">I</text><text x="${w - 12}" y="${y0 - 4}" font-size="10" fill="var(--muted)" font-family="monospace">t</text></svg>`;
}

        sol: R`\(\eta = \left(1 - \dfrac{m_p v_p^2}{m_C v_C^2}\right)\times 100 \approx 75\%\). <div class="note"><b>Lectura crítica:</b> con esta definición, 75 % es la energía que <i>no</i> pasó a la pelota. La fracción transferida es \(E_p/E_C \approx 25\%\). En el examen se usa la definición que te dan, pero vale la pena notarlo en tu reflexión.</div>`, ecf: true },
    ] },
  ]
},
{
  id: 'maradona', title: 'El tiro libre de Maradona', src: 'ONF 2010 · Problema 1', topics: ['Tiro parabólico', 'Sistemas de ecuaciones', 'Casos límite'],
  pearson: 'Pearson Physics: 2.4 (movimiento de proyectiles).',
  rubNote: 'La solución oficial indica cuánto vale cada pregunta (4, 3 y 3 puntos). El desglose en pasos es una propuesta basada en esa solución.',
  blurb: 'Barrera a 5 m, portería a 11 m: ¿cuánto margen de ángulo y de rapidez tuvo Maradona para meter el gol?',
  intro: R`<p>El 3 de noviembre de 1985 el Napoli venció 1–0 a la Juventus con un gol de Diego Armando Maradona. El árbitro marcó un tiro libre indirecto dentro del área. La barrera se colocó a unos <b>5 m</b> del balón y la portería estaba a <b>11 m</b>. Un compañero tocó ligeramente el balón y Maradona lo pateó: el balón pasó <b>rozando la cabeza</b> de un defensa de <b>1.80 m</b> (que no saltó) y entró a la portería <b>sin tocar el suelo</b>. El travesaño está a <b>2.44 m</b> de altura.</p>
  <p>Considera el balón como una partícula que sale con rapidez \(v\) y ángulo \(\theta\) sobre la horizontal, sin fricción del aire. ¿Qué tanto margen tuvo Maradona?</p>
  <p class="data">Barrera: (x₁, y₁) = (5 m, 1.80 m) · portería: x₂ = 11 m, entre y₂ = 0 y y₂ = 2.44 m · g = 9.8 m/s²</p>`,
  figure: kickFigure,
  parts: [
    { id: '1', q: R`¿Cuál es el intervalo de valores de \(\theta\) para que el balón entre a la portería sin tocar el piso?`, steps: [
      { id: 'k1a', kind: 'choice', pts: 1, label: 'Ecuación de la trayectoria', prompt: R`Elimina el tiempo de \(x = v\cos\theta\,t\) y \(y = v\sin\theta\,t - \tfrac12 g t^2\). La trayectoria es:`,
        options: [ch(R`\(y = x\tan\theta - \dfrac{g\,x^2}{2v^2\cos^2\theta}\)`, 1), ch(R`\(y = x\tan\theta - \dfrac{g\,x^2}{2v^2}\)`, 0, 'Al despejar t = x/(v cosθ) y elevar al cuadrado aparece cos²θ en el denominador.'), ch(R`\(y = x\sin\theta - \tfrac12 g x^2\)`, 0, 'Revisa dimensiones: g·x² no tiene unidades de longitud.'), ch(R`\(y = \dfrac{v^2\sin 2\theta}{g}\)`, 0, 'Esa es la fórmula del alcance en terreno plano, no la trayectoria y(x).')],
        sol: R`\(t = \dfrac{x}{v\cos\theta} \Rightarrow y = x\tan\theta - \dfrac{g x^2}{2v^2\cos^2\theta}\) (1)` },
      { id: 'k1b', kind: 'choice', pts: 1, label: 'Plantear las dos condiciones', prompt: 'Hay dos incógnitas (v y θ). Para el caso límite en que el balón entra justo debajo del travesaño, ¿por qué dos puntos debe pasar la trayectoria?',
        options: [ch('(5 m, 1.80 m) y (11 m, 2.44 m)', 1), ch('(0, 0) y (11 m, 2.44 m)', 0, 'El origen se cumple siempre con la ecuación (1): no da información nueva.'), ch('(5 m, 1.80 m) y (11 m, 0)', 0, 'Ese es el otro caso límite: el balón entra a ras del piso. Lo usarás en el paso 4.'), ch('Solo (11 m, 2.44 m)', 0, 'Con una sola condición no puedes encontrar dos incógnitas.')],
        sol: R`Se evalúa (1) en \((x_1,y_1) = (5, 1.8)\) y en \((x_2,y_2)\). Al combinar las dos ecuaciones se elimina \(v\): \(\tan\theta = \dfrac{y_1x_2^2 - y_2x_1^2}{x_1x_2^2 - x_2x_1^2}\) (2)` },
      { id: 'k1c', kind: 'num', key: 'thA', pts: 1, label: 'Ángulo con el balón bajo el travesaño', unit: '°', prompt: R`Usa (2) con \(y_2 = 2.44\) m. ¿Cuánto vale \(\theta\)?`, ans: () => 25.415, abs: .5,
        hint: R`\(\tan\theta = \dfrac{(1.8)(11^2) - (2.44)(5^2)}{(5)(11^2) - (11)(5^2)}\)`, sol: R`\(\tan\theta = \dfrac{217.8 - 61}{605 - 275} = 0.475 \Rightarrow \theta_{\text{alto}} \approx 25.4^\circ\)` },
      { id: 'k1d', kind: 'num', key: 'thB', pts: 1, label: 'Ángulo con el balón a ras del piso', unit: '°', prompt: R`Ahora con \(y_2 = 0\). ¿Cuánto vale \(\theta\)?`, ans: () => 33.425, abs: .5,
        sol: R`\(\tan\theta = \dfrac{217.8}{330} = 0.66 \Rightarrow \theta_{\text{bajo}} \approx 33.4^\circ\). Intervalo: \(25.4^\circ \le \theta \le 33.4^\circ\). ¡Solo 8° de margen!` },
    ] },
    { id: '2', q: 'Para ese intervalo de ángulos, ¿cuáles son las rapideces máxima y mínima con que debe salir el balón?', steps: [
      { id: 'k2a', kind: 'choice', pts: 1, label: 'Expresión para v', prompt: R`Despejando \(v^2\) de las dos condiciones se obtiene:`,
        options: [ch(R`\(v^2 = \dfrac{g\,x_1x_2(x_2 - x_1)}{2\cos^2\theta\,(y_1x_2 - y_2x_1)}\)`, 1), ch(R`\(v^2 = \dfrac{g\,x_2^2}{2\cos^2\theta\,y_2}\)`, 0, 'Esa expresión ignora la condición de la barrera.'), ch(R`\(v^2 = 2 g y_1\)`, 0, 'Eso sería lanzar el balón verticalmente hasta la altura y₁.')],
        sol: R`\(v^2 = \dfrac{g\,x_1x_2(x_2-x_1)}{2\cos^2\theta\,(y_1x_2 - y_2x_1)}\) (3)` },
      { id: 'k2b', kind: 'num', key: 'vA', pts: 1, label: 'Rapidez para el tiro alto', unit: 'm/s', prompt: R`Evalúa (3) con \(\theta = 25.4^\circ\) y \(y_2 = 2.44\) m.`, ans: c => Math.sqrt(g * 330 / (2 * Math.cos(rad(c.thA || 25.415)) ** 2 * (19.8 - 12.2))), tol: .03,
        sol: R`\(v_{\text{alto}} = \sqrt{\dfrac{9.8(5)(11)(6)}{2\cos^2 25.4^\circ\,(19.8 - 12.2)}} \approx 16.1\ \text{m/s}\)`, ecf: true },
      { id: 'k2c', kind: 'num', key: 'vB', pts: 1, label: 'Rapidez para el tiro bajo', unit: 'm/s', prompt: R`Evalúa (3) con \(\theta = 33.4^\circ\) y \(y_2 = 0\).`, ans: c => Math.sqrt(g * 330 / (2 * Math.cos(rad(c.thB || 33.425)) ** 2 * 19.8)), tol: .03,
        sol: R`\(v_{\text{bajo}} \approx 10.8\ \text{m/s}\). El balón debía salir entre unos 39 y 58 km/h.`, ecf: true },
    ] },
    { id: '3', q: '¿Cuál es el tiempo mínimo que tardaría el balón en entrar a la portería?', steps: [
      { id: 'k3a', kind: 'choice', pts: 1, label: 'Ecuación del tiempo', prompt: 'El tiempo para llegar a la portería es:',
        options: [ch(R`\(t_2 = \dfrac{x_2}{v\cos\theta}\)`, 1), ch(R`\(t_2 = \dfrac{2v\sin\theta}{g}\)`, 0, 'Ese es el tiempo de vuelo hasta volver al suelo en terreno plano.'), ch(R`\(t_2 = \dfrac{x_2}{v}\)`, 0, 'Horizontalmente el balón avanza con v cosθ, no con v.')],
        sol: R`Horizontalmente \(x_2 = v\cos\theta\,t_2\). Con (3): \(t_2 = \sqrt{\dfrac{2x_2(y_1x_2 - y_2x_1)}{g\,x_1(x_2-x_1)}}\)` },
      { id: 'k3b', kind: 'choice', pts: 1, label: 'Identificar el caso más rápido', prompt: '¿Qué tiro llega antes a la portería?',
        options: [ch('El que entra pegado al travesaño (y₂ grande)', 1), ch('El que entra a ras del piso', 0, 'En la expresión de t₂, y₂ aparece restando: mayor y₂, menor tiempo.'), ch('Tardan lo mismo', 0, 'Compara la expresión con y₂ = 0 y con y₂ = 2.44.')],
        sol: 'Mayor y₂ ⇒ menor t₂: el tiro alto, más rápido y más tendido, llega antes.' },
      { id: 'k3c', kind: 'num', key: 't2', pts: 1, label: 'Resultado: tiempo mínimo', unit: 's', prompt: 'Calcula el tiempo mínimo.', ans: () => 0.7541, tol: .03,
        sol: R`\(t_2 = \sqrt{\dfrac{2(11)(7.6)}{9.8(5)(6)}} \approx 0.75\ \text{s}\). El portero tuvo menos de un segundo.` },
    ] },
  ]
},
{
  id: 'montana', title: 'Montaña rusa con rizo cortado', src: 'ONF 2017 · Problema 2', topics: ['Energía', 'Dinámica circular', 'Tiro parabólico', 'Diseño'],
  pearson: 'Pearson Physics: cap. 5 (movimiento circular), cap. 6 (conservación de la energía), 2.4 (proyectiles).',
  rubNote: 'El examen oficial indica cuánto vale cada pregunta (2, 4, 3 y 1 puntos). La solución y el desglose en pasos son propuestas de este entrenador.',
  blurb: 'Un rizo con un hueco arriba: el carrito vuela y vuelve a caer en el riel. ¿Desde qué altura hay que soltarlo?',
  intro: R`<p>Al diseñar una montaña rusa se busca que sea segura. Nos concentramos en un <b>rizo circular de radio R</b>. Antes del rizo hay una pendiente desde la que se suelta un carrito, desde el reposo, a una altura <b>H</b> sobre el punto más bajo del rizo. No hay fricción.</p>
  <p>Los rizos completos son comunes, pero poco emocionantes. Queremos un rizo con un <b>corte simétrico en la parte superior</b> que abarca un ángulo \(2\alpha\) visto desde el centro: el carrito vuela libremente por la parte faltante y vuelve a entrar al rizo. Define \(\eta = H/R\).</p>
  <p class="data">Rizo de radio R · altura de salida H = ηR · corte de ángulo total 2α centrado en lo más alto · g = 9.8 m/s² · sin fricción</p>`,
  figure: coasterFigure,
  parts: [
    { id: '2.1', q: '¿Desde qué altura mínima debe descender el carrito para dar una vuelta completa al rizo (sin corte) sin despegarse?', steps: [
      { id: 'm1a', kind: 'choice', pts: 1, label: 'Condición en el punto más alto', prompt: 'En la parte más alta del rizo, el carrito no se despega si:',
        options: [ch(R`\(N \ge 0 \Rightarrow v_{\text{arriba}}^2 \ge gR\)`, 1), ch(R`\(v_{\text{arriba}} \ge 0\)`, 0, 'Por dentro de un rizo, el carrito se cae antes de detenerse: necesita que la fuerza centrípeta sea al menos su peso.'), ch(R`\(v_{\text{arriba}}^2 \ge 2gR\)`, 0, 'En el límite, el peso aporta toda la fuerza centrípeta: mg = mv²/R.')],
        sol: R`Arriba: \(N + mg = mv^2/R\). Con \(N \ge 0\): \(v^2 \ge gR\).` },
      { id: 'm1b', kind: 'num', key: 'eta0', pts: 1, label: 'Resultado: H mínima', unit: '× R', prompt: R`Con energía: \(mgH = mg(2R) + \tfrac12 m v_{\text{arriba}}^2\). Escribe el valor de \(H_{\min}/R\).`, ans: () => 2.5, abs: .02,
        sol: R`\(gH = 2gR + \tfrac12 gR \Rightarrow H_{\min} = \tfrac52 R\)` },
    ] },
    { id: '2.2', q: R`¿Cuánto vale \(\eta\) en función de \(\alpha\) para que el carrito cruce el corte y vuelva al riel? Verifica el resultado de 2.1 cuando \(\alpha = 0\).`, steps: [
      { id: 'm2a', kind: 'choice', pts: 1, label: 'Altura y dirección al salir del riel', prompt: R`Al llegar al borde del corte, el radio que lo une con el centro forma un ángulo \(\alpha\) con la vertical. ¿A qué altura está el carrito y hacia dónde apunta su velocidad?`,
        options: [ch(R`Altura \(R(1+\cos\alpha)\); velocidad tangente al rizo, a un ángulo \(\alpha\) sobre la horizontal`, 1), ch(R`Altura \(2R\); velocidad horizontal`, 0, 'Eso solo vale cuando α = 0.'), ch(R`Altura \(R(1+\sin\alpha)\); velocidad vertical`, 0, 'Dibuja el radio al borde: su proyección vertical es R cosα.')],
        sol: R`El borde está a una altura \(R + R\cos\alpha\) y la velocidad es tangente: forma un ángulo \(\alpha\) con la horizontal.` },
      { id: 'm2b', kind: 'choice', pts: 1, label: 'Condición de tiro parabólico', prompt: R`Para caer justo en el otro borde (a la misma altura y a una distancia horizontal \(2R\sin\alpha\)), la rapidez al salir debe cumplir:`,
        options: [ch(R`\(\dfrac{v^2\sin 2\alpha}{g} = 2R\sin\alpha \Rightarrow v^2 = \dfrac{gR}{\cos\alpha}\)`, 1), ch(R`\(v^2 = gR\cos\alpha\)`, 0, 'Revisa el despeje: sin2α = 2 sinα cosα.'), ch(R`\(\dfrac{v^2}{g} = 2R\sin\alpha\)`, 0, 'Ese es el alcance máximo (a 45°), no el alcance con ángulo α.')],
        sol: R`Alcance a la misma altura: \(\dfrac{v^2\sin2\alpha}{g} = 2R\sin\alpha \Rightarrow v^2 = \dfrac{gR}{\cos\alpha}\)` },
      { id: 'm2c', kind: 'choice', pts: 1, label: 'Conservación de la energía y expresión de η', prompt: R`Con energía, \(v^2 = 2g[H - R(1+\cos\alpha)]\). Igualando con el paso anterior:`,
        options: [ch(R`\(\eta = 1 + \cos\alpha + \dfrac{1}{2\cos\alpha}\)`, 1), ch(R`\(\eta = 1 + \cos\alpha + \dfrac{\cos\alpha}{2}\)`, 0, 'Revisa: v²/(2gR) = 1/(2cosα).'), ch(R`\(\eta = 2 + \dfrac{1}{2\cos\alpha}\)`, 0, 'La altura del borde depende de α: R(1 + cosα).')],
        sol: R`\(2g[H - R(1+\cos\alpha)] = \dfrac{gR}{\cos\alpha} \Rightarrow \eta = 1 + \cos\alpha + \dfrac{1}{2\cos\alpha}\). Con \(\alpha = 0\): \(\eta = 2.5\), igual que en 2.1 ✓` },
      { id: 'm2d', kind: 'num', key: 'eta30', pts: 1, label: 'Evaluar un caso', unit: '', prompt: R`¿Cuánto vale \(\eta\) para \(\alpha = 30^\circ\)?`, ans: () => 2.4434, tol: .01,
        sol: R`\(\eta = 1 + 0.866 + 0.577 \approx 2.44\): ¡se necesita <i>menos</i> altura que para el rizo completo!` },
    ] },
    { id: '2.3', q: R`Escribe \(\cos\alpha\) en función de \(\eta\). ¿Cuál es el valor mínimo de \(\eta\) y a qué ángulo corresponde?`, steps: [
      { id: 'm3a', kind: 'choice', pts: 1, label: 'Despejar cos α', prompt: R`Multiplicando por \(2\cos\alpha\): \(2\cos^2\alpha + 2(1-\eta)\cos\alpha + 1 = 0\). Entonces:`,
        options: [ch(R`\(\cos\alpha = \dfrac{(\eta-1) \pm \sqrt{(\eta-1)^2 - 2}}{2}\)`, 1), ch(R`\(\cos\alpha = \dfrac{(\eta-1) \pm \sqrt{(\eta-1)^2 - 8}}{4}\)`, 0, 'Revisa la fórmula general con a = 2, b = 2(1−η), c = 1.'), ch(R`\(\cos\alpha = \eta - 1\)`, 0, 'Es una ecuación cuadrática en cosα.')],
        sol: R`Fórmula general: \(\cos\alpha = \dfrac{(\eta-1)\pm\sqrt{(\eta-1)^2-2}}{2}\)` },
      { id: 'm3b', kind: 'num', key: 'etamin', pts: 1, label: 'Resultado: η mínima', unit: '', prompt: 'Para que exista una solución real, el discriminante no puede ser negativo. ¿Cuál es el η mínimo?', ans: () => 1 + Math.SQRT2, tol: .005,
        sol: R`\((\eta-1)^2 \ge 2 \Rightarrow \eta_{\min} = 1 + \sqrt2 \approx 2.414\)` },
      { id: 'm3c', kind: 'num', key: 'amin', pts: 1, label: 'Resultado: ángulo correspondiente', unit: '°', prompt: R`¿A qué \(\alpha\) corresponde \(\eta_{\min}\)?`, ans: () => 45, abs: .5,
        sol: R`\(\cos\alpha = \dfrac{\eta-1}{2} = \dfrac{\sqrt2}{2} \Rightarrow \alpha = 45^\circ\) (un corte total de 90°).` },
    ] },
    { id: '2.4', q: R`¿Qué otro ángulo \(\alpha\) corresponde también al \(\eta\) de la pregunta 2.1?`, steps: [
      { id: 'm4a', kind: 'num', key: 'a25', pts: 1, label: 'Resultado: segundo ángulo', unit: '°', prompt: R`Con \(\eta = 2.5\), resuelve la cuadrática. Una raíz es \(\alpha = 0\); ¿cuál es la otra?`, ans: () => 60, abs: .5,
        sol: R`\(2\cos^2\alpha - 3\cos\alpha + 1 = 0 \Rightarrow \cos\alpha = 1\) o \(\tfrac12\): \(\alpha = 60^\circ\). Compruébalo en la simulación con α = 60° y η = 2.5.` },
    ] },
  ]
},
{
  id: 'hielo', title: 'Hielo derritiéndose en agua salada', src: 'ONF 2007 · Problema 4', topics: ['Flotación', 'Principio de Arquímedes', 'Densidad', 'Mezclas'],
  pearson: 'Pearson Physics: cap. 3 (fuerzas y equilibrio). Para flotación, complementa con tu libro de hidrostática.',
  rubNote: 'El examen original no publicó puntajes para este problema: el desglose en pasos es una propuesta con el estilo de la ONF.',
  blurb: 'Si el hielo flota en agua dulce, el nivel no cambia al derretirse. ¿Y en agua salada?',
  intro: R`<p>En un recipiente cilíndrico con base de área <b>S = 100 cm²</b> se vierte <b>1 litro</b> de agua salada de densidad <b>ρ₁ = 1.15 g/cm³</b> y se coloca un trozo de hielo de agua dulce de masa <b>m = 1 kg</b>, que flota. ¿Cuánto cambia el nivel del agua en el recipiente cuando se derrite <b>la mitad</b> del hielo? Considera que la sal disuelta no cambia el volumen del líquido (los volúmenes de agua se suman).</p>
  <p class="data">S = 100 cm² · V₀ = 1000 cm³ de agua salada · ρ₁ = 1.15 g/cm³ · m = 1000 g · ρ (agua pura) = 1.00 g/cm³ · se derrite m/2</p>`,
  figure: iceFigure,
  parts: [
    { id: 'A', q: 'Volúmenes desplazados y agregados.', steps: [
      { id: 'h1', kind: 'num', key: 'V1', pts: 1.5, label: 'Volumen desplazado inicial V₁', unit: 'cm³', prompt: '¿Qué volumen de agua salada desplaza el hielo antes de derretirse?', ans: () => 1000 / 1.15, tol: .02,
        hint: 'Al flotar, el peso del hielo es igual al peso del líquido desplazado: m g = ρ₁ V₁ g.', sol: R`\(V_1 = \dfrac{m}{\rho_1} = \dfrac{1000}{1.15} \approx 870\ \text{cm}^3\)` },
      { id: 'h2', kind: 'choice', pts: 1, label: 'Volumen desplazado después, V₂', prompt: R`Queda la mitad del hielo flotando en un líquido de nueva densidad \(\rho_2\). Desplaza:`,
        options: [ch(R`\(V_2 = \dfrac{m/2}{\rho_2}\)`, 1), ch(R`\(V_2 = \dfrac{m/2}{\rho_1}\)`, 0, 'El agua derretida diluye la sal: la densidad ya no es ρ₁.'), ch(R`\(V_2 = \dfrac{m/2}{\rho}\)`, 0, 'El hielo flota en la mezcla, no en agua pura.')], sol: R`\(V_2 = \dfrac{m}{2\rho_2}\)` },
      { id: 'h3', kind: 'choice', pts: 1, label: 'Volumen de agua derretida V′', prompt: 'El agua del deshielo (agua pura) que se agrega ocupa:',
        options: [ch(R`\(V' = \dfrac{m/2}{\rho}\)`, 1), ch(R`\(V' = \dfrac{m/2}{\rho_1}\)`, 0, 'El hielo era de agua dulce: al derretirse tiene densidad ρ.'), ch(R`\(V' = \dfrac{m}{\rho}\)`, 0, 'Solo se derrite la mitad.')], sol: R`\(V' = \dfrac{m}{2\rho}\)` },
    ] },
    { id: 'B', q: 'Cambio de volumen y de altura.', steps: [
      { id: 'h4', kind: 'choice', pts: 1.5, label: 'Variación de volumen ΔV', prompt: R`El nivel depende del volumen que queda bajo la superficie. \(\Delta V = V_2 + V' - V_1\) es:`,
        options: [ch(R`\(\dfrac{m}{2}\left(\dfrac{1}{\rho_2} + \dfrac{1}{\rho}\right) - \dfrac{m}{\rho_1}\)`, 1), ch(R`\(\dfrac{m}{2}\left(\dfrac{1}{\rho_2} - \dfrac{1}{\rho}\right)\)`, 0, 'Revisa los signos y no olvides V₁.'), ch(R`\(0\)`, 0, 'Eso solo pasa si todo es agua dulce (ρ₁ = ρ₂ = ρ).')],
        sol: R`\(\Delta V = \dfrac{m}{2\rho_2} + \dfrac{m}{2\rho} - \dfrac{m}{\rho_1}\). Si todo fuera agua dulce, \(\Delta V = 0\): el hielo que flota no cambia el nivel al derretirse.` },
      { id: 'h5', kind: 'choice', pts: 1, label: 'Cambio de altura Δh', prompt: 'En un recipiente cilíndrico:',
        options: [ch(R`\(\Delta h = \Delta V / S\)`, 1), ch(R`\(\Delta h = \Delta V \cdot S\)`, 0, 'Revisa unidades: cm³ ÷ cm² = cm.'), ch(R`\(\Delta h = \sqrt{\Delta V}\)`, 0, 'El área de la base es constante.')], sol: R`\(\Delta h = \Delta V/S\)` },
    ] },
    { id: 'C', q: 'Densidad final y valor numérico del cambio de nivel.', steps: [
      { id: 'h6', kind: 'choice', pts: 1.5, label: 'Expresión de ρ₂', prompt: 'Densidad de la mezcla (masa total del líquido ÷ volumen total del líquido):',
        options: [ch(R`\(\rho_2 = \dfrac{\rho_1V_0 + m/2}{V_0 + m/(2\rho)}\)`, 1), ch(R`\(\rho_2 = \dfrac{\rho_1 + \rho}{2}\)`, 0, 'El promedio simple solo vale si se mezclan volúmenes iguales.'), ch(R`\(\rho_2 = \dfrac{\rho_1V_0}{V_0 + m/(2\rho)}\)`, 0, 'Falta sumar la masa del agua derretida.')],
        sol: R`\(\rho_2 = \dfrac{\rho_1V_0 + m/2}{V_0 + m/(2\rho)}\)` },
      { id: 'h7', kind: 'num', key: 'r2', pts: 1, label: 'Valor de ρ₂', unit: 'g/cm³', prompt: 'Evalúa ρ₂.', ans: () => 1.1, tol: .01, sol: R`\(\rho_2 = \dfrac{1150 + 500}{1000 + 500} = 1.10\ \text{g/cm}^3\)` },
      { id: 'h8', kind: 'num', key: 'dh', pts: 1.5, label: 'Resultado: cambio de nivel', unit: 'cm', prompt: '¿Cuánto cambia el nivel? (positivo si sube)', ans: c => (500 / (c.r2 || 1.1) + 500 - 1000 / 1.15) / 100, tol: .04,
        sol: R`\(\Delta V = 454.5 + 500 - 869.6 \approx 85\ \text{cm}^3 \Rightarrow \Delta h \approx 0.85\ \text{cm}\): el nivel <b>sube</b> unos 8.5 mm.`, ecf: true },
    ] },
  ]

  ${stageHTML(1, 'Conoce el problema de ejemplo', `

function mountProj(el) {
  el.innerHTML = `<div class="canvas-box"><canvas aria-label="Trayectorias de la pelota"></canvas></div>
  <div class="ctrls">${slider('pj-v', 'Rapidez inicial', 10, 80, 1, 56, 'm/s')}${slider('pj-a', 'Ángulo', 5, 85, 1, 16, '°')}</div>
  <div class="flex"><label class="chk"><input type="checkbox" id="pj-d" checked> Con arrastre del aire</label><button class="btn sm acc" id="pj-go">Lanzar</button><button class="ghost" id="pj-sw">Barrer ángulos</button><button class="ghost" id="pj-cl">Limpiar</button></div>
  <div class="readout" id="pj-r">Lanza para ver alcance, tiempo de vuelo y altura máxima.</div>`;
  const vS = bindSlider('pj-v', 'm/s'), aS = bindSlider('pj-a', '°'); let traces = []; let sweep = null;
  const k = .5 * 1.2 * .25 * Math.PI * .02135 ** 2 / .0459;
  const sim = (v0, th, drag) => { let x = 0, y = 0, vx = v0 * Math.cos(rad(th)), vy = v0 * Math.sin(rad(th)), t = 0; const pts = [[0, 0]]; let ym = 0; const dt = .002;
    while (y >= 0 && t < 30) { const v = Math.hypot(vx, vy); const ax = drag ? -k * v * vx : 0, ay = -g - (drag ? k * v * vy : 0); vx += ax * dt; vy += ay * dt; x += vx * dt; y += vy * dt; t += dt; ym = Math.max(ym, y); if (pts.length < 2000 && Math.round(t / dt) % 5 === 0) pts.push([x, Math.max(0, y)]); }
    return { pts, R: x, t, ym }; };
  const draw = (c, w, h) => { c.fillStyle = tok('--card'); c.fillRect(0, 0, w, h);
    const maxR = Math.max(60, ...traces.map(t => t.R)) * 1.08, maxY = Math.max(20, ...traces.map(t => t.ym)) * 1.15;
    const sx = Math.max(maxR, maxY * (w - 60) / (h - 50));

  return { cat: 'concept', why: `Su respuesta está ${r > 1 ? 'por arriba' : 'por debajo'} del valor correcto sin un patrón simple: probablemente la ecuación que usaron no corresponde a la situación. Comparen con la solución.` };
}
const ROLES = [['Lectora', 'Lee el reto en voz alta, identifica datos e incógnita'], ['Calculista', 'Plantea la ecuación y hace las cuentas'], ['Verificadora', 'Revisa unidades, orden de magnitud y registra la respuesta']];
let RS = null, rTimer = null;
function viewRally() {
  clearInterval(rTimer);
  if (!RS) { rallySetup(); return; }
  if (RS.phase === 'run') rallyRun(); else rallyEnd();
}
function rallySetup() {
  app.innerHTML = `<section class="view">
  <div class="sec-h"><p class="eyebrow">Entrenamiento en equipo</p><h2>Modo Rally</h2><p class="lead">Simula el formato del I Rally Digital de Física UANL: equipos de 3, un solo dispositivo, estaciones de retos con tiempo y una reflexión final.</p></div>
  <div class="howto"><b>Cómo se juega</b><ol><li>Escriban el nombre del equipo y de las tres integrantes, y elijan cuántas estaciones y minutos quieren.</li><li>En cada estación hay 4 retos rápidos. Los roles (lectora, calculista, verificadora) rotan en cada estación: lean qué hace cada una.</li><li>Escriban la respuesta numérica en las unidades indicadas y presionen «Enviar». Tienen dos intentos por reto.</li><li>Al final respondan la reflexión que pide la convocatoria y cópienla para practicarla con su asesor.</li></ol></div>
  <div class="facts">
    <div class="fact"><b>6 nov 2026, 9:00</b><span>Competencia en sesión de Teams</span></div>
    <div class="fact"><b>Equipos de 3</b><span>Un asesor por equipo; un solo dispositivo registra respuestas</span></div>
    <div class="fact"><b>Criterios</b><span>Puntuación total, retos resueltos, aplicación de conceptos y procedimientos, terminar a tiempo</span></div>
    <div class="fact"><b>Reflexión final</b><span>Reto más complejo, conceptos aplicados, estrategia y trabajo colaborativo</span></div>
  </div>
  <div class="card" style="display:grid;gap:14px">
    <div class="grid3">
      <label class="field">Nombre del equipo<input id="r-team" value="Los Vectores"></label>
      <label class="field">Integrante 1<input id="r-m0" value="Integrante 1"></label>
      <label class="field">Integrante 2<input id="r-m1" value="Integrante 2"></label>
      <label class="field">Integrante 3<input id="r-m2" value="Integrante 3"></label>
      <label class="field">Minutos por estación<select id="r-min"><option>5</option><option selected>8</option><option>10</option></select></label>
      <label class="field">Estaciones<select id="r-st"><option>2</option><option selected>3</option><option>4</option></select></label>
    </div>
    <p class="small">Cada estación tiene 4 retos al azar. 10 puntos si aciertan al primer intento, 5 al segundo. Los roles rotan en cada estación.</p>
    <div><button class="btn acc" id="r-go">Comenzar rally</button></div>
  </div></section>`;
  $('#r-go').addEventListener('click', () => {
    const ns = +$('#r-st').value, pool = BANK.map((_, i) => i).sort(() => Math.random() - .5);
    RS = { team: $('#r-team').value || 'Equipo', members: [0, 1, 2].map(i => $('#r-m' + i).value || `Integrante ${i + 1}`), min: +$('#r-min').value, ns, st: 0, qi: 0, score: 0, solved: 0, log: [],
      stations: Array.from({ length: ns }, (_, s) => pool.slice(s * 4, s * 4 + 4)), phase: 'run', tries: 0, end: Date.now() + (+$('#r-min').value) * 60000 };
    viewRally();
  });
}
function rallyRun() {
  const st = RS.stations[RS.st], idx = st[RS.qi], c = BANK[idx]; if (RS.curIdx !== idx) { RS.cur = []; RS.curIdx = idx; }
  app.innerHTML = `<section class="view">
  <div class="rally-top"><div><p class="eyebrow">${RS.team} · Estación ${RS.st + 1} de ${RS.ns} · Reto ${RS.qi + 1} de 4</p><h2 style="font-size:28px">Puntos: <span class="mono">${RS.score}</span></h2></div><div class="timer mono" id="r-t">--:--</div></div>
  <div class="roles">${ROLES.map((r, i) => `<div class="role"><b>${RS.members[(i + RS.st) % 3]} · ${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>
  <div class="card chal"><span class="chip">${c.t}</span><p class="q">${c.q}</p>
    <div class="ans"><input id="r-ans" inputmode="decimal" autocomplete="off" placeholder="respuesta" aria-label="Respuesta"><span class="unit">${c.u}</span></div>
    <div class="flex"><button class="btn acc sm" id="r-chk">Enviar</button><button class="ghost" id="r-skip">Saltar reto</button></div><div id="r-fb"></div></div>
  </section>`;
  const tEl = $('#r-t');
  const tick = () => { const ms = RS.end - Date.now(); if (ms <= 0) { nextStation(true); return; } const s = Math.ceil(ms / 1000); tEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; tEl.classList.toggle('low', s <= 60); };
  tick(); rTimer = setInterval(tick, 500);
  const next = () => { RS.tries = 0; RS.qi++; if (RS.qi >= 4) nextStation(false); else viewRally(); };
  $('#r-chk').addEventListener('click', () => {
    const x = parseNum($('#r-ans').value); const fb = $('#r-fb');
    if (!isFinite(x)) { fb.innerHTML = '<div class="fb no">Escribe un número.</div>'; return; }
    const ok = c.abs != null ? Math.abs(x - c.a) <= c.abs : Math.abs(x - c.a) <= .03 * Math.abs(c.a);
    if (ok) { const pts = RS.tries === 0 ? 10 : 5; RS.score += pts; RS.solved++; RS.cur.push(x); RS.log.push({ i: idx, ok: true, pts, ans: RS.cur, how: 'ans' }); fb.innerHTML = `<div class="fb ok">✓ +${pts} puntos. Respuesta: ${fmt(c.a)} ${c.u}. Verán la solución al final del rally.</div>`; clearInterval(rTimer); setTimeout(() => { if (RS && RS.phase === 'run' && location.hash === '#rally') next(); }, 1100); }
    else { RS.tries++; RS.cur.push(x); if (RS.tries >= 2) { RS.log.push({ i: idx, ok: false, pts: 0, ans: RS.cur, how: 'ans' }); fb.innerHTML = `<div class="fb no">Sin puntos. Respuesta: ${fmt(c.a)} ${c.u}. Al final del rally verán qué error probable cometieron y la solución.</div>`; clearInterval(rTimer); setTimeout(() => { if (RS && RS.phase === 'run' && location.hash === '#rally') next(); }, 1800); }
      else fb.innerHTML = '<div class="fb no">Incorrecto. Verificadora: revisen unidades y potencias de 10. Un intento más (vale 5).</div>'; }
  });
  $('#r-skip').addEventListener('click', () => { RS.log.push({ i: idx, ok: false, pts: 0, ans: RS.cur, how: 'skip' }); clearInterval(rTimer); next(); });
}
function nextStation(timeout) {
  clearInterval(rTimer);
  if (timeout) { const st = RS.stations[RS.st]; for (let i = RS.qi; i < 4; i++) RS.log.push({ i: st[i], ok: false, pts: 0, ans: i === RS.qi ? (RS.cur || []) : [], how: 'timeout' }); }
  RS.st++; RS.qi = 0; RS.tries = 0;
  if (RS.st >= RS.ns) RS.phase = 'end'; else RS.end = Date.now() + RS.min * 60000;
  viewRally();
}
function rallyEnd() {
  const L = RS.log, n = L.length, ok = L.filter(l => l.ok), bad = L.filter(l => !l.ok);
  const first = ok.filter(l => l.pts === 10).length, skipped = L.filter(l => l.how === 'skip').length, timeout = L.filter(l => l.how === 'timeout').length;
  const byTopic = {}; L.forEach(l => { const t = BANK[l.i].t; (byTopic[t] = byTopic[t] || { ok: 0, n: 0 }); byTopic[t].n++; if (l.ok) byTopic[t].ok++; });
  const cats = { units: 0, root: 0, factor: 0, concept: 0, sign: 0 };
  L.forEach(l => (l.ans || []).forEach((x, k) => { if (l.ok && k === l.ans.length - 1) return; const d = diagnose(BANK[l.i], x); if (cats[d.cat] != null) cats[d.cat]++; }));
  const advice = [];
  if (cats.units) advice.push(`<li><b>Unidades y potencias de 10 (${cats.units}).</b> Antes de sustituir, conviertan todo al SI (m, kg, s, C). La verificadora debe revisar cada conversión.</li>`);
  if (cats.root) advice.push(`<li><b>Raíces olvidadas (${cats.root}).</b> Cuando despejen de una ecuación con v² o t², escriban la raíz en el despeje antes de usar la calculadora.</li>`);
  if (cats.factor) advice.push(`<li><b>Factores numéricos (${cats.factor}).</b> Revisen ½, 2, 2π e «ida y vuelta». Ayuda escribir la ecuación completa antes de sustituir.</li>`);
  if (cats.concept) advice.push(`<li><b>Ecuación o concepto equivocado (${cats.concept}).</b> Dibujen la situación e identifiquen el principio (Newton, energía, momento…) antes de elegir una fórmula. Repasen los temas marcados abajo.</li>`);
  if (cats.sign) advice.push(`<li><b>Signos (${cats.sign}).</b> Elijan un sentido positivo y escríbanlo en la hoja.</li>`);
  if (skipped) advice.push(`<li><b>Retos saltados (${skipped}).</b> En el concurso, una respuesta aproximada puede valer más que ninguna. Saltar está bien si regresan después.</li>`);
  if (timeout) advice.push(`<li><b>Retos sin tiempo (${timeout}).</b> Repartan el tiempo: unos 2 minutos por reto. Si uno se atora, pasen al siguiente.</li>`);
  if (!advice.length) advice.push('<li>¡Ningún error en este rally! Prueben con menos minutos por estación o con los problemas largos del banco.</li>');
  const ans = l => (l.ans || []).length ? l.ans.map(x => `${fmt(x)} ${BANK[l.i].u}`).join(' → ') : (l.how === 'timeout' ? 'sin respuesta (se acabó el tiempo)' : 'sin respuesta (saltado)');
  const link = c => PMAP[c.p] ? `<a href="#p-${c.p}">${PMAP[c.p].title}</a>` : '';
  const card = (l, open) => { const c = BANK[l.i]; const wrongs = (l.ans || []).filter((x, k) => !(l.ok && k === l.ans.length - 1));
    return `<details class="card fbcard ${l.ok ? 'okc' : 'badc'}" ${open ? 'open' : ''}><summary><span class="chip">${c.t}</span> <b>${l.ok ? (l.pts === 10 ? '✓ Correcto al primer intento' : '✓ Correcto al segundo intento') : '✗ Sin puntos'}</b><span class="small"> · ${c.q}</span></summary>
      <div class="fbgrid"><div><span class="eyebrow">Su respuesta</span><p class="mono">${ans(l)}</p></div><div><span class="eyebrow">Respuesta correcta</span><p class="mono">${fmt(c.a)} ${c.u}</p></div></div>
      ${wrongs.map(x => `<div class="fb hint"><b>Posible error con ${fmt(x)}:</b> ${diagnose(c, x).why}</div>`).join('')}
      <div class="sol"><span class="tag">Solución paso a paso</span><ol style="margin:0;padding-left:20px">${c.s.map(s => `<li>${s}</li>`).join('')}</ol></div>
      ${!l.ok && link(c) ? `<p class="small">Para practicar este tema: ${link(c)}</p>` : ''}</details>`; };
  const failText = bad.length ? BANK[bad[0].i].q : '';
  app.innerHTML = `<section class="view">
  <div class="sec-h"><p class="eyebrow">Rally terminado · retroalimentación</p><h2>${RS.team}: ${RS.score} puntos</h2>
    <p class="lead">Resolvieron ${ok.length} de ${n} retos (${n ? Math.round(ok.length / n * 100) : 0} %), ${first} al primer intento. Abajo verán, reto por reto, qué hicieron bien, qué error probable cometieron y cómo se resolvía.</p></div>
  <div class="grid2">
    <div class="card" style="display:grid;gap:10px"><h3 style="font-size:20px">Resultado por tema</h3>
      <div class="tbl-wrap"><table class="map-t" style="min-width:0"><thead><tr><th>Tema</th><th>Aciertos</th><th>Estado</th></tr></thead><tbody>
      ${Object.entries(byTopic).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n).map(([t, v]) => `<tr><td>${t}</td><td class="mono">${v.ok} / ${v.n}</td><td>${v.ok === v.n ? '<span class="chip okchip">Dominado</span>' : v.ok ? '<span class="chip warnchip">Reforzar</span>' : '<span class="chip badchip">Repasar</span>'}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card" style="display:grid;gap:10px"><h3 style="font-size:20px">Lo que muestran sus errores</h3><ul style="margin:0;padding-left:20px;display:grid;gap:6px">${advice.join('')}</ul></div>
  </div>
  ${bad.length ? `<div class="sec-h"><h3 style="font-size:22px">Retos para revisar (${bad.length})</h3><p class="small">Léanlos en equipo: comparen su respuesta con la solución y expliquen en voz alta dónde estuvo el error.</p></div><div class="fblist">${bad.map(l => card(l, true)).join('')}</div>` : ''}
  ${ok.length ? `<div class="sec-h"><h3 style="font-size:22px">Aciertos (${ok.length})</h3><p class="small">Ábranlos para comparar su método con la solución. Si acertaron al segundo intento, verán qué falló en el primero.</p></div><div class="fblist">${ok.map(l => card(l, l.pts < 10)).join('')}</div>` : ''}
  <div class="card" style="display:grid;gap:12px"><h3 style="font-size:22px">Reflexión del equipo</h3><p class="small">La convocatoria pide una breve reflexión al final. Usen la retroalimentación de arriba para responderla.</p>
    <label class="field">¿Cuál fue el reto más complejo y por qué?<textarea id="rf1">${failText}</textarea></label>
    <label class="field">¿Qué conceptos de física aplicaron?<textarea id="rf2">${Object.keys(byTopic).join(', ')}</textarea></label>
    <label class="field">¿Qué estrategia de resolución siguieron?<textarea id="rf3">Leímos datos e incógnita, planteamos la ecuación simbólica, sustituimos con unidades y verificamos el orden de magnitud.</textarea></label>
    <label class="field">¿Cómo contribuyó el trabajo colaborativo?<textarea id="rf4"></textarea></label>
    <div class="flex"><button class="btn acc sm" id="rf-copy">Copiar reflexión</button><button class="ghost" id="r-new">Nuevo rally</button><span id="rf-ok" class="small"></span></div></div>
  </section>`;
  $('#r-new').addEventListener('click', () => { RS = null; viewRally(); });
  $('#rf-copy').addEventListener('click', () => {
    const txt = `Equipo ${RS.team} (${RS.members.join(', ')}) — ${RS.score} pts, ${ok.length} de ${n} retos\n1. Reto más complejo: ${$('#rf1').value}\n2. Conceptos: ${$('#rf2').value}\n3. Estrategia: ${$('#rf3').value}\n4. Trabajo colaborativo: ${$('#rf4').value}`;
    const done = m => { $('#rf-ok').textContent = m; };
    try { navigator.clipboard.writeText(txt).then(() => done('Copiado.'), () => done('No se pudo copiar; selecciona el texto manualmente.')); } catch (e) { done('No se pudo copiar; selecciona el texto manualmente.'); }
  });
}

  </tbody></table></div>

/* ---------- router ---------- */
function route() {
  clearInterval(rTimer);
  const h = (location.hash || '#inicio').slice(1);
  const v = h.startsWith('p-') ? 'problemas' : h;
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  if (h.startsWith('p-')) viewProblem(h.slice(2));
  else if (h === 'calificacion') viewCalificacion();
  else if (h === 'problemas') viewProblemas();
  else if (h === 'laboratorio') viewLab();
  else if (h === 'rally') viewRally();
  else if (h === 'recursos') viewRecursos();
  else viewInicio();
  window.scrollTo(0, 0);
}
app.addEventListener('click', e => {
  act(e);
  const m = e.target.closest('[data-mode]'); if (m) { const pid = (location.hash || '').slice(3); S.mode[pid] = m.dataset.mode; save(); viewProblem(pid); return; }
  const o = e.target.closest('[data-openrub]'); if (o) { const k = o.dataset.openrub + ':open'; S.x[k] = S.x[k] || {}; S.x[k][o.dataset.part] = true; save(); viewProblem(o.dataset.openrub); return; }
  const r = e.target.closest('[data-reset]'); if (r) { const pid = r.dataset.reset; if (r.dataset.confirm) { delete S.p[pid]; delete S.x[pid]; delete S.x[pid + ':open']; if (pid === 'golf') { GW.ln = Array(10).fill(''); GW.tableOk = false; GW.line = [{ t: 30, v: 12 }, { t: 170, v: 28 }]; } save(); viewProblem(pid); } else { r.dataset.confirm = '1'; r.textContent = 'Confirmar: borrar mi avance'; } }
});
app.addEventListener('change', e => { const c = e.target.closest('[data-exam]'); if (c) { const pid = c.dataset.exam; S.x[pid] = S.x[pid] || {}; S.x[pid][c.dataset.sid] = c.checked; save(); renderSheet(pid); } });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.step input[inputmode]')) { const b = e.target.closest('.step').querySelector('[data-act="check"]'); if (b) b.click(); } });
window.addEventListener('hashchange', route);
route();
})();
